<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; width: 300px; font-family: system-ui, sans-serif; font-size: 13px; background: #16161c; color: #eee; }
  .wrap { padding: 14px 16px 16px; }
  h1 { font-size: 15px; margin: 0; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .muted { color: #999; }
  .section { border-top: 1px solid #2c2c36; margin-top: 12px; padding-top: 12px; }
  .section h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: #999; margin: 0 0 8px; font-weight: 600; }
  .stats { display: flex; gap: 8px; }
  .stat { flex: 1; background: #20202a; border-radius: 8px; padding: 8px 10px; }
  .stat b { display: block; font-size: 20px; }
  .switch { position: relative; width: 46px; height: 26px; flex: none; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .slider { position: absolute; inset: 0; cursor: pointer; background: #444; border-radius: 26px; transition: background .2s; }
  .slider::before { content: ""; position: absolute; width: 20px; height: 20px; left: 3px; top: 3px; background: #fff; border-radius: 50%; transition: transform .2s; }
  input:checked + .slider { background: #e62832; }
  input:checked + .slider::before { transform: translateX(20px); }
  button { background: #2c2c38; color: #eee; border: 1px solid #3a3a48; border-radius: 6px; padding: 6px 10px; cursor: pointer; font: inherit; }
  button:hover { background: #363644; }
  button.wide { width: 100%; }
  button.x { padding: 0 6px; border: none; background: none; color: #999; font-size: 15px; }
  button.x:hover { color: #e62832; }
  input[type=text] { flex: 1; min-width: 0; background: #20202a; color: #eee; border: 1px solid #3a3a48; border-radius: 6px; padding: 6px 8px; font: inherit; }
  ul { list-style: none; margin: 8px 0 0; padding: 0; max-height: 110px; overflow-y: auto; }
  li { display: flex; justify-content: space-between; align-items: center; padding: 3px 0; border-bottom: 1px solid #22222a; }
  li span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .empty { color: #666; font-style: italic; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="row">
      <h1>GTA 6 Spoiler Blocker</h1>
      <label class="switch" title="Turn blocking on or off">
        <input type="checkbox" id="toggle">
        <span class="slider"></span>
      </label>
    </div>
    <div class="muted" id="status" style="margin-top:4px">Blocking: On</div>

    <div class="section">
      <div class="stats">
        <div class="stat"><b id="pageCount">–</b><span class="muted">on this page</span></div>
        <div class="stat"><b id="totalCount">0</b><span class="muted">blocked in total</span></div>
      </div>
    </div>

    <div class="section">
      <h2>This site</h2>
      <div class="muted" id="host" style="margin-bottom:8px">–</div>
      <button class="wide" id="siteBtn" disabled>Allow on this site</button>
    </div>

    <div class="section">
      <h2>My filters</h2>
      <form class="row" id="filterForm">
        <input type="text" id="filterInput" placeholder="Add a word or phrase" maxlength="60">
        <button type="submit">Add</button>
      </form>
      <ul id="filterList"></ul>
    </div>

    <div class="section">
      <h2>Allowed sites</h2>
      <ul id="siteList" style="margin-top:0"></ul>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
