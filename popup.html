<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { margin: 0; width: 240px; font-family: system-ui, sans-serif; background: #16161c; color: #eee; }
  .wrap { padding: 16px; }
  h1 { font-size: 15px; margin: 0 0 14px; }
  .row { display: flex; align-items: center; justify-content: space-between; }
  .status { font-size: 13px; color: #aaa; }
  .switch { position: relative; width: 46px; height: 26px; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .slider { position: absolute; inset: 0; cursor: pointer; background: #444; border-radius: 26px; transition: background .2s; }
  .slider::before { content: ""; position: absolute; width: 20px; height: 20px; left: 3px; top: 3px; background: #fff; border-radius: 50%; transition: transform .2s; }
  input:checked + .slider { background: #e62832; }
  input:checked + .slider::before { transform: translateX(20px); }
</style>
</head>
<body>
  <div class="wrap">
    <h1>GTA 6 Spoiler Blocker</h1>
    <div class="row">
      <span class="status" id="status">On</span>
      <label class="switch">
        <input type="checkbox" id="toggle">
        <span class="slider"></span>
      </label>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
